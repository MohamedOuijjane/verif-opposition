spring.application.name=verif-opposition
server.port=8080
# Écoute sur toutes les interfaces : accessible depuis le réseau local (192.168.x.x)
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/verif_vehicules?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=verif_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
